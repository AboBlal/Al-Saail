<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>السائل - Al-Sail</title>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; text-align: center; padding: 20px; }
        .container { background: white; max-width: 500px; margin: auto; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input { width: 80%; padding: 15px; border-radius: 10px; border: 2px solid #064e3b; margin-bottom: 10px; }
        button { background: #064e3b; color: white; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #res { margin-top: 20px; padding: 15px; background: #fff9e6; border-right: 5px solid #c5a059; display: none; text-align: right; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="color:#064e3b">السائل</h1>
        <input type="text" id="q" placeholder="اكتب سؤالك هنا...">
        <br>
        <button onclick="ask()">اسأل الآن</button>
        <div id="ld" style="display:none; margin:20px;">جاري التفكير...</div>
        <div id="res"></div>
    </div>

    <script>
        async function ask() {
            const q = document.getElementById('q').value;
            const resDiv = document.getElementById('res');
            const ld = document.getElementById('ld');
            
            // المفتاح الأخير الذي أرسلته
            const p1 = "AIzaSyBLMEQvu3f7";
            const p2 = "NDizI3M6pSbl3QcbS_fQJV8";
            const k = p1 + p2;

            if (!q) return;
            ld.style.display = 'block';
            resDiv.style.display = 'none';

            try {
                // استخدام الرابط v1beta المباشر
                const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + k, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "أجب كعالم شرعي: " + q }] }] })
                });

                const data = await response.json();
                ld.style.display = 'none';
                
                if (data.candidates) {
                    resDiv.style.display = 'block';
                    resDiv.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    alert("خطأ: " + (data.error ? data.error.message : "حاول ثانية"));
                }
            } catch (e) {
                ld.style.display = 'none';
                alert("تعذر الاتصال بالشبكة");
            }
        }
    </script>
</body>
</html>
